<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Parquet Wood Pattern -->
    <pattern id="parquet" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#92400e"/>
      <rect x="0" y="0" width="32" height="1" fill="#78350f"/>
      <rect x="0" y="16" width="32" height="1" fill="#78350f"/>
      <rect x="0" y="0" width="16" height="16" fill="#a16207" opacity="0.4"/>
      <rect x="16" y="16" width="16" height="16" fill="#a16207" opacity="0.4"/>
    </pattern>
    <!-- North Wall Pattern -->
    <pattern id="brickWall" width="32" height="16" patternUnits="userSpaceOnUse">
      <rect width="32" height="16" fill="#1e293b"/>
      <rect x="0" y="0" width="32" height="2" fill="#0f172a"/>
      <rect x="16" y="8" width="1" height="8" fill="#0f172a"/>
      <rect x="0" y="0" width="1" height="8" fill="#0f172a"/>
    </pattern>
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="arcadeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-pixel { font-family: 'Press Start 2P', monospace, sans-serif; }
    .font-kana { font-family: 'DotGothic16', monospace, sans-serif; font-weight: bold; }
  </style>

  <!-- Void Border -->
  <rect width="800" height="450" fill="#0a0914"/>

  <!-- Room Interior Area (x: 40 to 760, y: 30 to 410) -->
  <!-- Parquet Floor -->
  <rect x="40" y="70" width="720" height="340" fill="url(#parquet)"/>

  <!-- North Wall -->
  <rect x="40" y="30" width="720" height="48" fill="url(#brickWall)"/>
  <!-- Wall Baseboard -->
  <rect x="40" y="74" width="720" height="4" fill="#0f172a"/>

  <!-- Exit Steel Door at Center Wall -->
  <rect x="360" y="24" width="80" height="54" fill="#334155" stroke="#f59e0b" stroke-width="3"/>
  <rect x="370" y="32" width="60" height="42" fill="#1e293b"/>
  <!-- Key Emblem on Door -->
  <circle cx="400" cy="50" r="10" fill="#f59e0b"/>
  <circle cx="400" cy="50" r="6" fill="#1e293b"/>
  <rect x="398" y="58" width="4" height="12" fill="#f59e0b"/>
  <rect x="402" y="62" width="6" height="3" fill="#f59e0b"/>
  <!-- Target Word Plaque -->
  <rect x="368" y="10" width="64" height="14" fill="#020617" stroke="#f59e0b" stroke-width="1.5" rx="1"/>
  <text x="400" y="21" text-anchor="middle" class="font-kana" font-size="10" fill="#facc15">かぎ 🔑</text>

  <!-- Left Interactable 1: Iron Safe (Timed Code) -->
  <circle cx="160" cy="130" r="60" fill="url(#deskGlow)"/>
  <rect x="130" y="100" width="60" height="50" fill="#475569" stroke="#0f172a" stroke-width="2"/>
  <circle cx="160" cy="125" r="12" fill="#334155" stroke="#facc15" stroke-width="2"/>
  <rect x="158" y="123" width="4" height="4" fill="#ef4444"/>
  <text x="160" y="170" text-anchor="middle" class="font-pixel" font-size="8" fill="#cbd5e1">IRON SAFE</text>
  <!-- Kana reward badge floating -->
  <rect x="150" y="80" width="20" height="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
  <text x="160" y="93" text-anchor="middle" class="font-kana" font-size="12" fill="#38bdf8">か</text>

  <!-- Right Interactable 2: Retro Arcade Machine (2048) -->
  <circle cx="640" cy="130" r="70" fill="url(#arcadeGlow)"/>
  <rect x="610" y="85" width="55" height="70" fill="#0f172a" stroke="#06b6d4" stroke-width="3"/>
  <!-- Marquee -->
  <rect x="614" y="89" width="47" height="14" fill="#ec4899"/>
  <text x="637" y="100" text-anchor="middle" class="font-pixel" font-size="7" fill="#ffffff">ARCADE</text>
  <!-- Screen -->
  <rect x="615" y="108" width="45" height="28" fill="#020617"/>
  <rect x="620" y="112" width="10" height="10" fill="#facc15"/>
  <rect x="633" y="112" width="10" height="10" fill="#fb923c"/>
  <rect x="620" y="124" width="10" height="10" fill="#4ade80"/>
  <rect x="633" y="124" width="10" height="10" fill="#38bdf8"/>
  <text x="637" y="175" text-anchor="middle" class="font-pixel" font-size="8" fill="#cbd5e1">2048 STATION</text>
  <!-- Kana reward badge floating -->
  <rect x="627" y="65" width="20" height="18" fill="#1e1b4b" stroke="#facc15" stroke-width="1.5" rx="2"/>
  <text x="637" y="78" text-anchor="middle" class="font-kana" font-size="12" fill="#facc15">ぎ</text>

  <!-- Bottom Left: Circuit Switchboard (Color Match) -->
  <rect x="130" y="270" width="55" height="50" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <circle cx="145" cy="290" r="4" fill="#ef4444"/>
  <circle cx="160" cy="290" r="4" fill="#22c55e"/>
  <circle cx="145" cy="305" r="4" fill="#3b82f6"/>
  <circle cx="160" cy="305" r="4" fill="#eab308"/>
  <text x="157" y="338" text-anchor="middle" class="font-pixel" font-size="8" fill="#cbd5e1">CIRCUITS</text>

  <!-- Bottom Right: Cyber Terrarium (Snake) -->
  <rect x="610" y="270" width="55" height="50" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="616" y="276" width="43" height="38" fill="#022c22"/>
  <!-- Snake pixel body inside -->
  <rect x="622" y="285" width="6" height="6" fill="#34d399"/>
  <rect x="628" y="285" width="6" height="6" fill="#34d399"/>
  <rect x="634" y="285" width="6" height="6" fill="#34d399"/>
  <rect x="640" y="295" width="5" height="5" fill="#f87171"/>
  <text x="637" y="338" text-anchor="middle" class="font-pixel" font-size="8" fill="#cbd5e1">TERRARIUM</text>

  <!-- Center Character (Aoi) Walking Step -->
  <!-- Shadow -->
  <ellipse cx="388" cy="254" rx="14" ry="5" fill="#000000" opacity="0.4"/>
  <!-- Body / Skirt -->
  <rect x="378" y="210" width="20" height="30" fill="#db2777" rx="3"/>
  <rect x="382" y="234" width="5" height="16" fill="#312e81"/>
  <rect x="390" y="232" width="5" height="18" fill="#312e81"/>
  <rect x="381" y="248" width="6" height="4" fill="#e11d48"/>
  <rect x="390" y="248" width="6" height="4" fill="#e11d48"/>
  <!-- Head -->
  <rect x="380" y="196" width="16" height="16" fill="#fed7aa" rx="2"/>
  <!-- Hair -->
  <rect x="377" y="192" width="22" height="8" fill="#4c0519"/>
  <rect x="377" y="196" width="4" height="14" fill="#4c0519"/>
  <rect x="395" y="196" width="4" height="14" fill="#4c0519"/>
  <!-- Eyes -->
  <rect x="383" y="202" width="3" height="3" fill="#111827"/>
  <rect x="389" y="202" width="3" height="3" fill="#111827"/>

  <!-- Floating Ambient Dust Motes in air -->
  <circle cx="280" cy="180" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="310" cy="240" r="2" fill="#bae6fd" opacity="0.5"/>
  <circle cx="480" cy="160" r="1.5" fill="#fde047" opacity="0.7"/>
  <circle cx="520" cy="230" r="1" fill="#bae6fd" opacity="0.6"/>
  <circle cx="430" cy="290" r="2" fill="#fef08a" opacity="0.4"/>

  <!-- Interactive Context Prompt Floating Above -->
  <rect x="300" y="145" width="200" height="26" fill="#020617" stroke="#38bdf8" stroke-width="2" rx="3"/>
  <text x="400" y="162" text-anchor="middle" class="font-pixel" font-size="8" fill="#38bdf8">[E] EXAMINE WORKBENCH</text>

  <!-- Top In-Game HUD Overlay -->
  <rect x="40" y="6" width="720" height="22" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="52" y="21" class="font-pixel" font-size="8" fill="#facc15">ROOM 1: THE DETECTIVE&apos;S WORKSHOP</text>
  <text x="470" y="21" class="font-pixel" font-size="8" fill="#4ade80">ESCAPE TIME: 01:42</text>
  <text x="660" y="21" class="font-pixel" font-size="8" fill="#38bdf8">KANA: 2/6</text>

  <!-- Bottom Inventory Bar -->
  <rect x="40" y="415" width="720" height="30" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="434" class="font-pixel" font-size="8" fill="#94a3b8">KANA BELT [I]:</text>
  <!-- Acquired Kana Slot 1 -->
  <rect x="180" y="418" width="30" height="24" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
  <text x="195" y="435" text-anchor="middle" class="font-kana" font-size="14" fill="#38bdf8">か</text>
  <!-- Acquired Kana Slot 2 -->
  <rect x="220" y="418" width="30" height="24" fill="#1e1b4b" stroke="#facc15" stroke-width="1.5" rx="2"/>
  <text x="235" y="435" text-anchor="middle" class="font-kana" font-size="14" fill="#facc15">ぎ</text>
  <!-- Empty Slots -->
  <rect x="260" y="418" width="30" height="24" fill="#0f172a" stroke="#334155" stroke-dasharray="2" rx="2"/>
  <rect x="300" y="418" width="30" height="24" fill="#0f172a" stroke="#334155" stroke-dasharray="2" rx="2"/>

  <!-- Controls Reminder -->
  <text x="560" y="434" class="font-pixel" font-size="7" fill="#64748b">WASD = Move | [I] Crafter | [ESC] Pause</text>
</svg>
