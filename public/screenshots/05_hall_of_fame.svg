<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="hofGlow" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-pixel { font-family: 'Press Start 2P', monospace, sans-serif; }
    .font-kana { font-family: 'DotGothic16', monospace, sans-serif; font-weight: bold; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="450" fill="#090d16"/>
  <circle cx="400" cy="120" r="220" fill="url(#hofGlow)"/>

  <!-- Leaderboard Window Box -->
  <rect x="80" y="25" width="640" height="400" rx="4" fill="#111827" stroke="#f59e0b" stroke-width="4"/>
  <rect x="86" y="31" width="628" height="388" fill="none" stroke="#78350f" stroke-width="1.5"/>

  <!-- Window Header -->
  <text x="400" y="60" text-anchor="middle" class="font-pixel" font-size="14" fill="#facc15">🏆 RUNS HALL OF FAME 🏆</text>
  <text x="400" y="76" text-anchor="middle" class="font-pixel" font-size="8" fill="#94a3b8">RECORDED ESCAPE EXPEDITIONS &amp; SPEEDRUNS</text>

  <!-- Table Header -->
  <rect x="105" y="92" width="590" height="26" fill="#1e293b"/>
  <text x="125" y="109" class="font-pixel" font-size="8" fill="#facc15">RANK</text>
  <text x="200" y="109" class="font-pixel" font-size="8" fill="#facc15">RUN NAME</text>
  <text x="380" y="109" class="font-pixel" font-size="8" fill="#facc15">EXPLORER</text>
  <text x="490" y="109" class="font-pixel" font-size="8" fill="#facc15">KANA</text>
  <text x="590" y="109" class="font-pixel" font-size="8" fill="#facc15">TIME</text>

  <!-- Row 1 (Rank 1 - Gold Highlight) -->
  <rect x="105" y="122" width="590" height="36" fill="#713f12" opacity="0.3"/>
  <rect x="105" y="122" width="590" height="36" fill="none" stroke="#eab308" stroke-width="1.5"/>
  <text x="130" y="145" class="font-pixel" font-size="12" fill="#facc15">🥇 #1</text>
  <text x="200" y="145" class="font-pixel" font-size="9" fill="#fef08a">SPEEDRUN LEGEND</text>
  <rect x="330" y="133" width="34" height="15" fill="#eab308" rx="2"/>
  <text x="347" y="144" text-anchor="middle" class="font-pixel" font-size="6" fill="#000000">NEW</text>
  <text x="380" y="145" class="font-pixel" font-size="8" fill="#38bdf8">AOI</text>
  <text x="500" y="145" class="font-pixel" font-size="9" fill="#4ade80">14</text>
  <text x="590" y="145" class="font-pixel" font-size="9" fill="#facc15">04:18</text>
  <text x="670" y="145" class="font-pixel" font-size="10" fill="#facc15">➔</text>

  <!-- Row 2 (Rank 2 - Silver) -->
  <rect x="105" y="162" width="590" height="34" fill="#1e293b" opacity="0.4"/>
  <text x="130" y="184" class="font-pixel" font-size="12" fill="#e2e8f0">🥈 #2</text>
  <text x="200" y="184" class="font-pixel" font-size="9" fill="#e2e8f0">KANJI MASTER</text>
  <text x="380" y="184" class="font-pixel" font-size="8" fill="#38bdf8">REN</text>
  <text x="500" y="184" class="font-pixel" font-size="9" fill="#4ade80">12</text>
  <text x="590" y="184" class="font-pixel" font-size="9" fill="#cbd5e1">06:45</text>
  <text x="670" y="184" class="font-pixel" font-size="10" fill="#94a3b8">➔</text>

  <!-- Row 3 (Rank 3 - Bronze) -->
  <rect x="105" y="200" width="590" height="34" fill="#451a03" opacity="0.2"/>
  <text x="130" y="222" class="font-pixel" font-size="12" fill="#fb923c">🥉 #3</text>
  <text x="200" y="222" class="font-pixel" font-size="9" fill="#fed7aa">FIRST CLEAR TRIAL</text>
  <text x="380" y="222" class="font-pixel" font-size="8" fill="#38bdf8">BOB</text>
  <text x="500" y="222" class="font-pixel" font-size="9" fill="#4ade80">10</text>
  <text x="590" y="222" class="font-pixel" font-size="9" fill="#cbd5e1">09:12</text>
  <text x="670" y="222" class="font-pixel" font-size="10" fill="#94a3b8">➔</text>

  <!-- Floating Run Details Inspector Card (Previewing Row 1 Words) -->
  <rect x="140" y="245" width="520" height="135" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="4"/>
  <rect x="145" y="250" width="510" height="24" fill="#1e293b"/>
  <text x="160" y="266" class="font-pixel" font-size="8" fill="#38bdf8">INSPECTING: &quot;SPEEDRUN LEGEND&quot; (RANK #1)</text>
  <text x="560" y="266" class="font-pixel" font-size="7" fill="#4ade80">WORDS CREATED (3)</text>

  <!-- Word 1 -->
  <rect x="155" y="282" width="155" height="42" fill="#020617" stroke="#334155" stroke-width="1" rx="2"/>
  <text x="170" y="304" font-size="18">🔑</text>
  <text x="195" y="298" class="font-kana" font-size="13" fill="#facc15">かぎ (鍵)</text>
  <text x="195" y="315" class="font-pixel" font-size="6" fill="#94a3b8">[kagi] • Key</text>

  <!-- Word 2 -->
  <rect x="320" y="282" width="155" height="42" fill="#020617" stroke="#334155" stroke-width="1" rx="2"/>
  <text x="335" y="304" font-size="18">🚪</text>
  <text x="360" y="298" class="font-kana" font-size="13" fill="#facc15">とびら (扉)</text>
  <text x="360" y="315" class="font-pixel" font-size="6" fill="#94a3b8">[tobira] • Door</text>

  <!-- Word 3 -->
  <rect x="485" y="282" width="160" height="42" fill="#020617" stroke="#22c55e" stroke-width="1.5" rx="2"/>
  <text x="500" y="304" font-size="18">⛩️</text>
  <text x="525" y="298" class="font-kana" font-size="13" fill="#86efac">でぐち (出口)</text>
  <text x="525" y="315" class="font-pixel" font-size="6" fill="#86efac">[deguchi] • EXIT KEY</text>

  <text x="400" y="358" text-anchor="middle" class="font-pixel" font-size="7" fill="#64748b">
    Click any run on the leaderboard to inspect its stats and created vocabulary
  </text>

  <!-- Close / Back Button -->
  <rect x="325" y="390" width="150" height="28" fill="#334155" stroke="#cbd5e1" stroke-width="1.5" rx="2"/>
  <text x="400" y="408" text-anchor="middle" class="font-pixel" font-size="8" fill="#ffffff">CLOSE TABLE [ESC]</text>
</svg>
