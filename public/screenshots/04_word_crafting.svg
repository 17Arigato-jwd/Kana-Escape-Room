<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="goldGlowModal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-pixel { font-family: 'Press Start 2P', monospace, sans-serif; }
    .font-kana { font-family: 'DotGothic16', monospace, sans-serif; font-weight: bold; }
  </style>

  <!-- Darkened Background Overlay -->
  <rect width="800" height="450" fill="#030712" opacity="0.95"/>

  <!-- Modal Frame (Pixel-art gold border) -->
  <rect x="140" y="25" width="520" height="400" rx="4" fill="#17162b" stroke="#f59e0b" stroke-width="4"/>
  <rect x="146" y="31" width="508" height="388" fill="none" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Modal Header -->
  <text x="400" y="58" text-anchor="middle" class="font-pixel" font-size="12" fill="#facc15">WORD CRAFTING WORKBENCH</text>
  <text x="400" y="74" text-anchor="middle" class="font-pixel" font-size="8" fill="#94a3b8">ROOM 1 TARGET: &quot;かぎ&quot; (KEY 🔑)</text>

  <!-- 4 Building Slots Section -->
  <rect x="170" y="85" width="460" height="85" fill="#090d16" stroke="#334155" stroke-width="2" rx="4"/>
  <text x="400" y="102" text-anchor="middle" class="font-pixel" font-size="8" fill="#cbd5e1">FORGING SLOTS (DRAG OR CLICK KANA)</text>

  <!-- Slot 1: [か] -->
  <rect x="230" y="110" width="55" height="50" rx="3" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
  <text x="257" y="145" text-anchor="middle" class="font-kana" font-size="28" fill="#38bdf8">か</text>
  <text x="257" y="156" text-anchor="middle" class="font-pixel" font-size="6" fill="#94a3b8">ka</text>

  <!-- Plus -->
  <text x="310" y="140" text-anchor="middle" class="font-pixel" font-size="14" fill="#64748b">+</text>

  <!-- Slot 2: [ぎ] -->
  <rect x="335" y="110" width="55" height="50" rx="3" fill="#1e1b4b" stroke="#facc15" stroke-width="2"/>
  <text x="362" y="145" text-anchor="middle" class="font-kana" font-size="28" fill="#facc15">ぎ</text>
  <text x="362" y="156" text-anchor="middle" class="font-pixel" font-size="6" fill="#94a3b8">gi</text>

  <!-- Slot 3: Empty -->
  <rect x="420" y="110" width="55" height="50" rx="3" fill="#0f172a" stroke="#334155" stroke-dasharray="3" stroke-width="1.5"/>
  <text x="447" y="140" text-anchor="middle" class="font-pixel" font-size="9" fill="#475569">[3]</text>

  <!-- Slot 4: Empty -->
  <rect x="490" y="110" width="55" height="50" rx="3" fill="#0f172a" stroke="#334155" stroke-dasharray="3" stroke-width="1.5"/>
  <text x="517" y="140" text-anchor="middle" class="font-pixel" font-size="9" fill="#475569">[4]</text>

  <!-- Discovered Word Recognition Card -->
  <rect x="170" y="180" width="460" height="95" fill="#064e3b" stroke="#22c55e" stroke-width="2.5" rx="4"/>
  <circle cx="210" cy="225" r="28" fill="#022c22"/>
  <text x="210" y="235" text-anchor="middle" font-size="28">🔑</text>

  <text x="260" y="210" class="font-kana" font-size="24" fill="#fef08a">かぎ <tspan font-size="16" fill="#86efac">(鍵)</tspan></text>
  <text x="260" y="230" class="font-pixel" font-size="9" fill="#38bdf8">ROMAJI: &quot;kagi&quot;</text>
  <text x="260" y="250" class="font-pixel" font-size="10" fill="#ffffff">MEANING: Key / Lock Opener</text>
  <rect x="520" y="210" width="90" height="30" fill="#22c55e" rx="3"/>
  <text x="565" y="230" text-anchor="middle" class="font-pixel" font-size="9" fill="#022c22">MATCH!</text>

  <!-- Door Unlock Status Alert -->
  <rect x="170" y="285" width="460" height="35" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" rx="3"/>
  <text x="400" y="306" text-anchor="middle" class="font-pixel" font-size="8" fill="#fef08a">
    ★ TARGET WORD CRAFTED! STEEL EXIT DOOR UNLOCKED! ★
  </text>

  <!-- Available Inventory Tray Below -->
  <text x="175" y="340" class="font-pixel" font-size="8" fill="#94a3b8">COLLECTED KANA INVENTORY:</text>
  <!-- Kana Tile 1 -->
  <rect x="170" y="350" width="45" height="42" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
  <text x="192" y="378" text-anchor="middle" class="font-kana" font-size="20" fill="#38bdf8">か</text>

  <!-- Kana Tile 2 -->
  <rect x="225" y="350" width="45" height="42" fill="#1e1b4b" stroke="#facc15" stroke-width="1.5" rx="2"/>
  <text x="247" y="378" text-anchor="middle" class="font-kana" font-size="20" fill="#facc15">ぎ</text>

  <!-- Kana Tile 3 -->
  <rect x="280" y="350" width="45" height="42" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" rx="2"/>
  <text x="302" y="378" text-anchor="middle" class="font-kana" font-size="20" fill="#a855f7">み</text>

  <!-- Kana Tile 4 -->
  <rect x="335" y="350" width="45" height="42" fill="#1e1b4b" stroke="#22c55e" stroke-width="1.5" rx="2"/>
  <text x="357" y="378" text-anchor="middle" class="font-kana" font-size="20" fill="#22c55e">と</text>

  <!-- Action Buttons -->
  <rect x="490" y="355" width="140" height="32" fill="#eab308" stroke="#ffffff" stroke-width="1.5" rx="2"/>
  <text x="560" y="375" text-anchor="middle" class="font-pixel" font-size="9" fill="#000000">PROCEED ➔</text>
</svg>
